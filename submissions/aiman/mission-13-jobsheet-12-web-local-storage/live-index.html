<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Profile</title>
<style>
body{font-family:Arial,sans-serif;background:#eef2f7;margin:0;padding:30px;color:#1f2937}
.card{max-width:420px;margin:auto;background:white;border:1px solid #d1d9e6;border-radius:14px;padding:22px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
h2{text-align:center;color:#1e3a8a;margin:0 0 18px}
input{width:100%;padding:10px;margin:6px 0;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;box-sizing:border-box}
button{background:#2563eb;color:white;border:0;border-radius:8px;padding:10px 14px;margin:8px 3px 0 0;font-size:14px;font-weight:bold;cursor:pointer}
#btnClear{background:#dc2626}
#output{margin:16px 0 4px;padding:10px;background:#f1f5f9;border-radius:8px;min-height:20px}
#count{margin:6px 0 0;color:#475569;font-size:14px}
</style>
</head>
<body>
<div class="card">
<h2 id="heading">Student Profile</h2>

<input type="text" id="txtName" placeholder="Enter name">
<input type="text" id="txtCourse" placeholder="Enter course">

<button id="btnSave">Save Data</button>
<button id="btnLoad">Load Data</button>
<button id="btnClear">Clear Data</button>

<p id="output"></p>
<p id="count"></p>
</div>

<script>
var count = localStorage.getItem("saveCount");
if (count === null) {
  count = 0;
} else {
  count = parseInt(count);
}
document.getElementById("count").textContent = "Times saved: " + count;

document.getElementById("btnSave").addEventListener("click", function () {
  localStorage.setItem("studentName", document.getElementById("txtName").value);
  localStorage.setItem("studentCourse", document.getElementById("txtCourse").value);

  count = count + 1;
  localStorage.setItem("saveCount", count);

  document.getElementById("count").textContent = "Times saved: " + count;
  document.getElementById("output").textContent = "Data saved successfully.";
});

document.getElementById("btnLoad").addEventListener("click", function () {
  var name = localStorage.getItem("studentName");
  var course = localStorage.getItem("studentCourse");
  if (name !== null && course !== null) {
    document.getElementById("output").textContent = "Name: " + name + " | Course: " + course;
  } else {
    document.getElementById("output").textContent = "No data found.";
  }
});

document.getElementById("btnClear").addEventListener("click", function () {
  localStorage.removeItem("studentName");
  localStorage.removeItem("studentCourse");
  document.getElementById("txtName").value = "";
  document.getElementById("txtCourse").value = "";
  document.getElementById("output").textContent = "Data cleared.";
});
</script>
</body>
</html>
