<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Tablets</title>
<style>
body{font-family:Arial,sans-serif;background:#eef2f7;margin:0;padding:30px;color:#1f2937}
h2{text-align:center;color:#1e3a8a;margin:0 0 25px}
.wrapper{max-width:700px;margin:auto}
.tablet{background:white;border:1px solid #d1d9e6;border-radius:14px;padding:18px 22px;margin:15px 0;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.tablet h3{margin:0 0 10px;color:#1e40af;border-left:5px solid #3b82f6;padding-left:10px}
.detail{margin:0;padding:10px 12px;background:#f1f5f9;border-radius:8px;font-size:15px}
.selected{border:3px solid #1a73e8;box-shadow:0 6px 16px rgba(26,115,232,.35)}
.buttons{text-align:center;margin-top:25px}
button{background:#2563eb;color:white;border:0;border-radius:8px;padding:10px 16px;margin:5px 3px;font-size:14px;font-weight:bold;cursor:pointer}
#btnReset{background:#dc2626}
</style>
<script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
</head>
<body>
<div class="wrapper">
<h2 id="heading">Digital Tablets</h2>

<div class="tablet" id="tablet1">
<h3>Apple iPad</h3>
<p class="detail">10.9-inch display | 64GB storage</p>
</div>

<div class="tablet" id="tablet2">
<h3>Samsung Galaxy Tab</h3>
<p class="detail">11-inch display | 128GB storage</p>
</div>

<div class="buttons">
<button id="btnToggle1">Toggle iPad Details</button>
<button id="btnToggle2">Toggle Galaxy Tab Details</button>
<button id="btnHighlight">Highlight Tablets</button>
<button id="btnHeading">Change Heading</button>
<button id="btnReset">Reset</button>
</div>
</div>

<script>
$(document).ready(function(){
  $(".detail").hide();

  $("#btnToggle1").click(function(){
    $("#tablet1 .detail").toggle();
  });

  $("#btnToggle2").click(function(){
    $("#tablet2 .detail").toggle();
  });

  $("#btnHighlight").click(function(){
    $(".tablet").css("background-color","lightblue").addClass("selected");
  });

  $("#btnHeading").click(function(){
    $("#heading").text("Best Digital Tablets");
  });

  $("#btnReset").click(function(){
    $(".detail").hide();
    $(".tablet").removeClass("selected").css("background-color","white");
    $("#heading").text("Digital Tablets");
  });
});
</script>
</body>
</html>
